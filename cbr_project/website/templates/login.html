{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="auth-container"><div class="auth-card"><h1>Login</h1><p>Sign in to order your food.</p>
{% if error %}<div class="error-message">{{ error }}</div>{% endif %}
<form action="{{ url_for('login') }}" method="POST"><label for="email">Email</label><input type="email" id="email" name="email" required><label for="password">Password</label><input type="password" id="password" name="password" required><button type="submit">Login</button></form>
<p class="auth-link">Don't have an account? <a href="{{ url_for('register') }}">Register</a></p></div></div>
{% endblock %}
